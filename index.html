<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedIn Ghostwriter</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --text: #37352f;
    --muted: rgba(55, 53, 47, 0.65);
    --faint: rgba(55, 53, 47, 0.45);
    --line: rgba(55, 53, 47, 0.09);
    --line-strong: rgba(55, 53, 47, 0.22);
    --hover: rgba(55, 53, 47, 0.06);
    --pop: #ffffff;
    --pop-shadow: rgba(15, 15, 15, 0.05) 0 0 0 1px, rgba(15, 15, 15, 0.1) 0 3px 6px, rgba(15, 15, 15, 0.2) 0 9px 24px;
    --card: #ffffff;
    --card-shadow: rgba(15, 15, 15, 0.07) 0 0 0 1px, rgba(15, 15, 15, 0.07) 0 2px 4px;
    /* The Workout Tracker's colors: coral, yellow, and green, plus the teal of the banner's background.
       Headings and tags use only these, plus gray. The banner keeps its color in dark mode, so the drawing stays readable. */
    --banner: #b4e0db;
    --c-coral: rgba(229, 130, 131, 0.42); --c-yellow: rgba(242, 228, 157, 0.5); --c-green: rgba(206, 231, 170, 0.5); --c-teal: rgba(179, 227, 223, 0.5);
    --t-gray: rgba(227, 226, 224, 0.6); --f-gray: #32302c; --d-gray: #91918e;
    --t-coral: rgba(229, 130, 131, 0.3); --f-coral: #6b2a2b; --d-coral: #d9686a;
    --t-yellow: rgba(242, 228, 157, 0.65); --f-yellow: #5c4d12; --d-yellow: #cfb23a;
    --t-green: rgba(206, 231, 170, 0.7); --f-green: #35501a; --d-green: #86b856;
    --t-teal: rgba(179, 227, 223, 0.65); --f-teal: #1f4f4b; --d-teal: #5fb3ab;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Apple Color Emoji", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #191919;
      --text: rgba(255, 255, 255, 0.81);
      --muted: rgba(255, 255, 255, 0.5);
      --faint: rgba(255, 255, 255, 0.3);
      --line: rgba(255, 255, 255, 0.094);
      --line-strong: rgba(255, 255, 255, 0.22);
      --hover: rgba(255, 255, 255, 0.055);
      --pop: #252525;
      --pop-shadow: rgba(255, 255, 255, 0.08) 0 0 0 1px, rgba(0, 0, 0, 0.3) 0 3px 6px, rgba(0, 0, 0, 0.45) 0 9px 24px;
      --card: #252525;
      --card-shadow: rgba(255, 255, 255, 0.07) 0 0 0 1px, rgba(0, 0, 0, 0.3) 0 2px 4px;
      --c-coral: rgba(229, 130, 131, 0.24); --c-yellow: rgba(242, 228, 157, 0.2); --c-green: rgba(206, 231, 170, 0.2); --c-teal: rgba(179, 227, 223, 0.18);
      --t-gray: #3f4245;
      --t-coral: rgba(229, 130, 131, 0.26); --t-yellow: rgba(242, 228, 157, 0.2); --t-green: rgba(206, 231, 170, 0.2); --t-teal: rgba(179, 227, 223, 0.2);
      --f-gray: rgba(255, 255, 255, 0.86);
      --f-coral: var(--f-gray); --f-yellow: var(--f-gray); --f-green: var(--f-gray); --f-teal: var(--f-gray);
      --d-gray: #8f8f8f;
      --d-coral: #e58283; --d-yellow: #f2e49d; --d-green: #cee7aa; --d-teal: #b3e3df;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(35, 131, 226, 0.28); }
  [hidden] { display: none !important; }
  button { cursor: pointer; background: none; border: 0; padding: 0; font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid rgba(35, 131, 226, 0.6); outline-offset: 1px; border-radius: 4px; }
  .i { width: 14px; height: 14px; flex: none; }

  /* Error notice: hidden unless the data can't load, a save fails, or the script fails */
  .toast { position: fixed; right: 16px; bottom: 16px; z-index: 60; display: flex; align-items: center; gap: 8px; max-width: calc(100vw - 32px); padding: 8px 12px; border-radius: 6px; background: var(--pop); box-shadow: var(--pop-shadow); color: #d44c47; font-size: 14px; }
  .toast.calm { color: var(--muted); }
  .toast button { height: 26px; padding: 0 8px; border-radius: 4px; color: var(--text); }
  .toast button:hover { background: var(--hover); }

  /* Short Notion-style banner; the icon overlaps its bottom edge by half */
  .banner { position: relative; height: clamp(150px, 16vw, 220px); overflow: hidden; background: var(--banner); }
  .banner img { position: absolute; inset: 0; display: block; width: 92%; max-width: 1320px; height: 100%; margin-inline: auto; object-fit: cover; object-position: center 52%; }
  .banner ~ .page .page-icon { position: relative; z-index: 1; margin-top: -52px; }

  .page { max-width: 1400px; margin: 0 auto; padding: 0 72px 120px; }
  .page-icon { display: block; width: 104px; height: 104px; margin: 44px 0 0 -4px; font-size: 88px; line-height: 104px; user-select: none; }
  .title { margin: 18px 0 14px; font-size: 40px; font-weight: 700; line-height: 1.2; }
  /* Header and board share three columns, so the sticky note sits over the last lane */
  .head, .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; align-items: start; }
  .head { margin: 0 0 30px; }
  .head-main { grid-column: span 2; min-width: 0; }
  .note { position: relative; margin-top: -4px; padding: 14px 16px 12px; border-radius: 4px; background: #fffaf0; color: #3d3a32; box-shadow: 0 0 0 1px rgba(60, 50, 20, 0.08), 0 6px 16px rgba(60, 50, 20, 0.1); }
  .note::before { content: ""; position: absolute; top: -6px; left: 50%; width: 12px; height: 12px; border-radius: 50%; background: #d9686a; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); transform: translateX(-50%); }
  .note h3 { margin: 0 0 6px; color: rgba(61, 58, 50, 0.6); font-size: 12px; font-weight: 600; }
  .note p { margin: 0; font-size: 14px; line-height: 1.4; }
  .note p + p { margin-top: 6px; }
  .note strong { font-weight: 600; }
  .note span { color: rgba(61, 58, 50, 0.65); }

  /* Lanes: ideas waiting, drafts to post, and what's out */
  .lane { min-width: 0; }
  .callout { display: flex; align-items: center; gap: 10px; padding: 12px 16px 12px 14px; border-radius: 6px; }
  .callout.yellow { background: var(--c-yellow); }
  .callout.coral { background: var(--c-coral); }
  .callout.green { background: var(--c-green); }
  .callout h2 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.3; }
  .count { margin-left: auto; color: var(--muted); font-size: 14px; }
  .emoji { width: 22px; flex: none; font-size: 18px; line-height: 1; text-align: center; }
  .cards { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .empty { margin: 14px 2px; color: var(--muted); font-size: 14px; }
  .more { height: 28px; margin-top: 8px; padding: 0 8px; border-radius: 4px; color: var(--muted); font-size: 14px; }
  .more:hover { background: var(--hover); }

  /* Cards, like the Workout Tracker's */
  .card { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 10px 12px 11px; border-radius: 6px; background: var(--card); box-shadow: var(--card-shadow); }
  .card-head { display: flex; align-items: flex-start; gap: 8px; }
  .card-title { flex: 1; min-width: 0; margin: 0; font-size: 15px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
  a.card-title { text-decoration: none; }
  a.card-title:hover { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
  .plan { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
  .meta:empty { display: none; }
  .when { color: var(--faint); font-size: 12px; }
  .drop { display: grid; place-items: center; flex: none; width: 22px; height: 22px; margin: -1px -4px 0 0; border-radius: 4px; color: var(--faint); opacity: 0; }
  .card:hover .drop, .drop:focus-visible { opacity: 1; }
  .drop:hover { background: var(--hover); color: var(--muted); }
  /* One click marks a draft posted; clicking again takes it back */
  .check { display: grid; place-items: center; flex: none; width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-strong); color: transparent; }
  .check:hover { box-shadow: inset 0 0 0 1.5px var(--d-green); color: var(--d-green); }
  .check.on { background: var(--d-green); box-shadow: none; color: #fff; }
  .check .i { width: 11px; height: 11px; }

  .tag { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; height: 20px; padding: 0 6px; border-radius: 3px; background: var(--tb); color: var(--tf); font-size: 12px; line-height: 20px; white-space: nowrap; }
  .tag > span { overflow: hidden; text-overflow: ellipsis; }
  .tag.status { padding: 0 8px 0 7px; border-radius: 10px; }
  .tag.status::before { content: ""; width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--td); }
  .k-gray { --tb: var(--t-gray); --tf: var(--f-gray); --td: var(--d-gray); }
  .k-coral { --tb: var(--t-coral); --tf: var(--f-coral); --td: var(--d-coral); }
  .k-yellow { --tb: var(--t-yellow); --tf: var(--f-yellow); --td: var(--d-yellow); }
  .k-green { --tb: var(--t-green); --tf: var(--f-green); --td: var(--d-green); }
  .k-teal { --tb: var(--t-teal); --tf: var(--f-teal); --td: var(--d-teal); }

  /* Confirm dialog: StashBase blocks the browser's own confirm(), so it's built into the page */
  .modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: rgba(15, 15, 15, 0.4); }
  .modal-card { width: min(420px, 100%); padding: 20px 20px 16px; border-radius: 10px; background: var(--pop); box-shadow: var(--pop-shadow); }
  .modal-card h3 { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
  .modal-body { color: var(--muted); font-size: 14px; }
  .modal-body p { margin: 0 0 8px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .ghost-btn { height: 28px; padding: 0 12px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line-strong); font-size: 14px; }
  .ghost-btn:hover { background: var(--hover); }
  .danger-btn { height: 28px; padding: 0 12px; border-radius: 6px; background: var(--d-coral); color: #fff; font-size: 14px; font-weight: 600; }
  .danger-btn:hover { filter: brightness(0.94); }

  @media (hover: none) {
    .drop { opacity: 1; }
  }
  @media (max-width: 1040px) {
    .head, .board { grid-template-columns: minmax(0, 1fr); }
    .head-main { grid-column: auto; }
    .page { padding: 0 40px 96px; }
  }
  @media (max-width: 640px) {
    .page { padding: 0 18px 80px; }
    .title { font-size: 32px; }
    .banner { height: clamp(96px, 24vw, 120px); }
    .banner ~ .page .page-icon { width: 80px; height: 80px; margin-top: -40px; font-size: 68px; line-height: 80px; }
  }
</style>
</head>
<body>
  <div class="toast" id="toast" hidden>
    <span id="toast-text" role="status" aria-live="polite"></span>
    <button type="button" id="retry" hidden>Retry</button>
    <button type="button" id="toast-close" aria-label="Close" title="Close">×</button>
  </div>

  <section class="banner" aria-label="Illustration of a desk with a laptop showing a post, a phone, a lightbulb, and a calendar">
    <img src="./assets/banner.png" width="2172" height="724" alt="" fetchpriority="high" decoding="async">
  </section>

  <main class="page">
    <div class="page-icon" role="img" aria-label="Notepad">🗒️</div>
    <div class="head">
      <div class="head-main">
        <h1 class="title">LinkedIn Ghostwriter</h1>
      </div>
      <aside class="note" id="start" aria-label="What to say in Chat"></aside>
    </div>

    <div class="board">
      <section class="lane" aria-labelledby="h-ideas">
        <div class="callout yellow"><span class="emoji" aria-hidden="true">💡</span><h2 id="h-ideas">Ideas</h2><span class="count" id="n-ideas"></span></div>
        <div id="ideas"></div>
      </section>
      <section class="lane" aria-labelledby="h-drafts">
        <div class="callout coral"><span class="emoji" aria-hidden="true">✍️</span><h2 id="h-drafts">Drafts</h2><span class="count" id="n-drafts"></span></div>
        <div id="drafts"></div>
      </section>
      <section class="lane" aria-labelledby="h-posted">
        <div class="callout green"><span class="emoji" aria-hidden="true">✅</span><h2 id="h-posted">Posted</h2><span class="count" id="n-posted"></span></div>
        <div id="posted"></div>
      </section>
    </div>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title"></h3>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" data-modal="cancel">Cancel</button>
        <button type="button" class="danger-btn" data-modal="ok">OK</button>
      </div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // The dashboard is a list of what's next: ideas waiting to be written, drafts waiting to go out, and what's posted.
  // It all comes from one data file. Each post is its own file in posts/, and its title links there:
  // StashBase opens a relative link in a new tab. The page can mark a draft posted and drop an idea; the Agent does the rest.
  const DATA_PATH = "./assets/posts.json";
  const POSTS_DIR = "posts/";
  const POSTED_SHOWN = 6;
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const PATHS = {
    x: '<path d="m4.5 4.5 7 7M11.5 4.5l-7 7"/>',
    check: '<path d="m3 8.5 3.2 3L13 4.5"/>',
  };
  const icon = (name) => `<svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[name]}</svg>`;

  const $ = (selector) => document.querySelector(selector);
  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const isObj = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
  const arr = (value) => (Array.isArray(value) ? value : []);
  const str = (value) => (typeof value === "string" ? value : "");
  const isDate = (s) => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);

  // Dates are local calendar days, never times.
  const parse = (s) => {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  };
  const keyOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const short = (s) => {
    const d = parse(s);
    return `${MONTHS[d.getMonth()]} ${d.getDate()}${d.getFullYear() === new Date().getFullYear() ? "" : `, ${d.getFullYear()}`}`;
  };
  // Newest first; anything without a date goes last.
  const newestFirst = (key) => (a, b) => (b[key] || "").localeCompare(a[key] || "");

  // Each idea and post keeps `at`, its place in the file, so the page changes exactly that entry.
  function normalize(raw) {
    const src = isObj(raw) ? raw : {};
    return {
      example: src.example === true,
      ideas: arr(src.ideas).map((i, at) => (isObj(i) ? {
        at,
        date: isDate(i.date) ? i.date : "",
        idea: str(i.idea).trim(),
        plan: str(i.plan).trim(),
        series: i.series === true,
      } : null)).filter((i) => i && i.idea).sort(newestFirst("date")),
      posts: arr(src.posts).map((p, at) => (isObj(p) ? {
        at,
        date: isDate(p.date) ? p.date : "",
        title: str(p.title).trim(),
        file: str(p.file).trim(),
        series: str(p.series).trim(),
        posted: isDate(p.posted) ? p.posted : p.posted === true ? true : null,
      } : null)).filter((p) => p && p.title),
    };
  }

  const api = window.stashbase?.data;
  let raw = {};
  let data = normalize(raw);
  let canSave = false;
  let saveError = "";
  let saving = false;
  let revision = 0;
  let savedRevision = 0;
  let saveTimer = 0;
  let queue = Promise.resolve();
  let toastKind = "";
  let allPosted = false;

  /* ---------- Saving: each change goes to the shared draft at once, and to the file after a short pause ---------- */

  const snapshot = () => JSON.parse(JSON.stringify(raw));

  function enqueue(operation) {
    const task = queue.then(operation);
    queue = task.catch(() => {});
    return task;
  }

  function commit() {
    revision += 1;
    data = normalize(raw);
    if (canSave) {
      const snap = snapshot();
      enqueue(() => api.update(snap)).catch((error) => {
        saveError = `Couldn't save: ${error?.message || error}`;
        renderSaveState();
      });
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 800);
    }
    renderSaveState();
    render();
  }

  async function save() {
    clearTimeout(saveTimer);
    if (!canSave || saving || savedRevision === revision) return;
    const rev = revision;
    const snap = snapshot();
    saving = true;
    try {
      await enqueue(async () => {
        await api.update(snap);
        await api.save();
      });
      savedRevision = rev;
      saveError = "";
    } catch (error) {
      saveError = `Couldn't save: ${error?.message || error}`;
    } finally {
      saving = false;
      if (!saveError && savedRevision !== revision) saveTimer = setTimeout(save, 800);
      renderSaveState();
    }
  }

  // Saving is quiet: the notice shows only when something is wrong, or once in a plain browser, where nothing saves.
  function renderSaveState() {
    if (canSave && saveError) notify(`${saveError}. Your changes are still on the page.`, "save");
    else if (toastKind === "save") hideToast();
    else if (!canSave && revision === 1) notify("Preview mode · changes won't be saved", "preview");
  }

  /* ---------- Views ---------- */

  function renderNote() {
    // "Set me up" only while the template's example is still here.
    const steps = [data.example && "Set me up.", "I have an idea: …", "Write about …"].filter(Boolean);
    $("#start").innerHTML = `<h3>Say in Chat</h3>${steps.map((say) => `<p><strong>“${esc(say)}”</strong></p>`).join("")}`;
  }

  const postLink = (p) => (p.file
    ? `<a class="card-title" href="${POSTS_DIR}${encodeURIComponent(p.file)}">${esc(p.title)}</a>`
    : `<p class="card-title">${esc(p.title)}</p>`);
  const seriesTag = (name) => (name ? `<span class="tag k-teal" title="${esc(name)}"><span>${esc(name)}</span></span>` : "");

  function ideaCard(i) {
    const written = i.series ? data.posts.filter((p) => p.series === i.idea).length : 0;
    return `<div class="card">
      <div class="card-head">
        <p class="card-title">${esc(i.idea)}</p>
        <button type="button" class="drop" data-drop="${i.at}" aria-label="Drop this idea" title="Drop this idea">${icon("x")}</button>
      </div>
      ${i.plan ? `<p class="plan">${esc(i.plan)}</p>` : ""}
      <div class="meta">${i.series ? `<span class="tag k-teal">Series · ${written} written</span>` : ""}${i.date ? `<span class="when">Added ${esc(short(i.date))}</span>` : ""}</div>
    </div>`;
  }

  function postCard(p) {
    const on = !!p.posted;
    const label = on ? "Mark as not posted" : "Mark as posted";
    const status = on ? `<span class="tag status k-green">${p.posted === true ? "Posted" : `Posted ${esc(short(p.posted))}`}</span>` : "";
    const written = !on && p.date ? `<span class="when">Written ${esc(short(p.date))}</span>` : "";
    return `<div class="card">
      <div class="card-head">
        <button type="button" class="check${on ? " on" : ""}" data-check="${p.at}" aria-pressed="${on}" aria-label="${label}" title="${label}">${icon("check")}</button>
        ${postLink(p)}
      </div>
      <div class="meta">${status}${seriesTag(p.series)}${written}</div>
    </div>`;
  }

  function lane(id, items, card, empty, more = "") {
    $(`#${id}`).innerHTML = items.length ? `<div class="cards">${items.map(card).join("")}</div>${more}` : `<p class="empty">${empty}</p>`;
  }

  function render() {
    renderNote();
    const drafts = data.posts.filter((p) => !p.posted).sort(newestFirst("date"));
    // Posted: newest out first; one posted on an unknown day goes by the day it was written.
    const outDay = (p) => (isDate(p.posted) ? p.posted : p.date);
    const posted = data.posts.filter((p) => p.posted).sort((a, b) => outDay(b).localeCompare(outDay(a)));
    const shown = allPosted ? posted : posted.slice(0, POSTED_SHOWN);
    const more = posted.length > POSTED_SHOWN
      ? `<button type="button" class="more" data-more>${allPosted ? "Show fewer" : `Show all ${posted.length}`}</button>`
      : "";
    $("#n-ideas").textContent = data.ideas.length || "";
    $("#n-drafts").textContent = drafts.length || "";
    $("#n-posted").textContent = posted.length || "";
    lane("ideas", data.ideas, ideaCard, "No ideas yet. Say “I have an idea: …” in Chat.");
    lane("drafts", drafts, postCard, "Nothing waiting. Say “Write about …” with one of your ideas.");
    lane("posted", shown, postCard, "Nothing posted yet.", more);
  }

  /* ---------- Changes from the page ---------- */

  function togglePosted(at) {
    const p = arr(raw.posts)[at];
    if (!isObj(p)) return;
    p.posted = p.posted ? null : keyOf(new Date());
    commit();
  }

  async function dropIdea(at) {
    const i = arr(raw.ideas)[at];
    if (!isObj(i)) return;
    const ok = await ask("Drop this idea?", `<p>“${esc(str(i.idea))}” will be gone from your ideas.</p>`, "Drop");
    if (!ok || arr(raw.ideas)[at] !== i) return;
    raw.ideas.splice(at, 1);
    commit();
  }

  /* ---------- Confirm dialog ---------- */

  const modalEl = $("#modal");
  let modalResolve = null;
  function ask(title, bodyHtml, okLabel = "OK") {
    $("#modal-title").textContent = title;
    $("#modal-body").innerHTML = bodyHtml;
    const ok = modalEl.querySelector('[data-modal="ok"]');
    ok.textContent = okLabel;
    modalEl.hidden = false;
    ok.focus();
    return new Promise((resolve) => { modalResolve = resolve; });
  }
  function closeModal(result) {
    if (!modalResolve) return;
    modalEl.hidden = true;
    const resolve = modalResolve;
    modalResolve = null;
    resolve(result);
  }
  modalEl.addEventListener("click", (event) => {
    const button = event.target.closest("[data-modal]");
    if (button) closeModal(button.dataset.modal === "ok");
    else if (event.target === modalEl) closeModal(false);
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !modalEl.hidden) closeModal(false);
  });

  document.addEventListener("click", (event) => {
    const t = event.target;
    const check = t.closest("[data-check]");
    if (check) return togglePosted(Number(check.dataset.check));
    const drop = t.closest("[data-drop]");
    if (drop) return dropIdea(Number(drop.dataset.drop));
    if (t.closest("[data-more]")) {
      allPosted = !allPosted;
      render();
    }
  });

  /* ---------- Start ---------- */

  // There's no console in StashBase, so problems show at the bottom right, ready to pass on.
  function notify(message, kind) {
    toastKind = kind;
    $("#toast-text").textContent = message;
    $("#toast").classList.toggle("calm", kind === "preview");
    $("#retry").hidden = kind !== "save";
    $("#toast").hidden = false;
  }
  function hideToast() {
    toastKind = "";
    $("#toast").hidden = true;
  }
  const showProblem = (message) => notify(message, "error");
  const lineOf = (stack) => /:(\d+):\d+\)?\s*$/m.exec(String(stack || "").split("\n")[1] || "")?.[1];
  addEventListener("error", (event) => {
    if (/ResizeObserver loop/i.test(event.message || "")) return;
    const line = event.lineno || lineOf(event.error?.stack);
    showProblem(`Page error: ${event.message || "unknown error"}${line ? ` (line ${line})` : ""}`);
  });
  addEventListener("unhandledrejection", (event) => {
    const reason = event.reason;
    const line = lineOf(reason?.stack);
    showProblem(`Page error: ${reason?.message || reason}${line ? ` (line ${line})` : ""}`);
  });
  $("#toast-close").addEventListener("click", hideToast);
  $("#retry").addEventListener("click", () => {
    saveError = "";
    hideToast();
    save();
  });
  addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") save();
  });
  addEventListener("beforeunload", (event) => {
    if (canSave && (saving || savedRevision !== revision)) {
      event.preventDefault();
      event.returnValue = "";
    }
  });

  async function start() {
    try {
      if (api && typeof api.load === "function") {
        raw = await api.load(DATA_PATH);
        canSave = typeof api.update === "function" && typeof api.save === "function";
      } else {
        try {
          const response = await fetch(DATA_PATH);
          if (response.ok) raw = await response.json();
        } catch {
          // Opened straight from disk in a browser, the page can't read its data, so it shows empty.
        }
      }
    } catch (error) {
      showProblem(`Couldn't load the dashboard: ${error?.message || error}`);
    }
    raw = isObj(raw) ? raw : {};
    data = normalize(raw);
    render();
  }

  start();
})();
</script>
</body>
</html>
