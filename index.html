<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedIn Ghostwriter</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --text: #37352f;
    --muted: rgba(55, 53, 47, 0.65);
    --faint: rgba(55, 53, 47, 0.45);
    --line: rgba(55, 53, 47, 0.09);
    --line-strong: rgba(55, 53, 47, 0.22);
    --hover: rgba(55, 53, 47, 0.06);
    --pop: #ffffff;
    --pop-shadow: rgba(15, 15, 15, 0.05) 0 0 0 1px, rgba(15, 15, 15, 0.1) 0 3px 6px, rgba(15, 15, 15, 0.2) 0 9px 24px;
    --card: #ffffff;
    --card-shadow: rgba(15, 15, 15, 0.07) 0 0 0 1px, rgba(15, 15, 15, 0.06) 0 2px 4px;
    /* The Workout Tracker's colors: coral, yellow, green, and its Notion blue, plus the teal of the banner's background.
       Tags and columns use only these, plus gray. The banner keeps its color in dark mode, so the drawing stays readable. */
    --banner: #b4e0db;
    /* Board columns: a faint wash of each status's color, like a Notion board */
    --lane-yellow: rgba(242, 228, 157, 0.22); --lane-blue: rgba(211, 229, 239, 0.42); --lane-green: rgba(206, 231, 170, 0.26);
    --t-gray: rgba(227, 226, 224, 0.6); --f-gray: #32302c; --d-gray: #91918e;
    --t-coral: rgba(229, 130, 131, 0.3); --f-coral: #6b2a2b; --d-coral: #d9686a;
    --t-yellow: rgba(242, 228, 157, 0.65); --f-yellow: #5c4d12; --d-yellow: #cfb23a;
    --t-green: rgba(206, 231, 170, 0.7); --f-green: #35501a; --d-green: #86b856;
    --t-blue: #d3e5ef; --f-blue: #183347; --d-blue: #5b97bd;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Apple Color Emoji", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #191919;
      --text: rgba(255, 255, 255, 0.81);
      --muted: rgba(255, 255, 255, 0.5);
      --faint: rgba(255, 255, 255, 0.3);
      --line: rgba(255, 255, 255, 0.094);
      --line-strong: rgba(255, 255, 255, 0.22);
      --hover: rgba(255, 255, 255, 0.055);
      --pop: #252525;
      --pop-shadow: rgba(255, 255, 255, 0.08) 0 0 0 1px, rgba(0, 0, 0, 0.3) 0 3px 6px, rgba(0, 0, 0, 0.45) 0 9px 24px;
      --card: #252525;
      --card-shadow: rgba(255, 255, 255, 0.07) 0 0 0 1px, rgba(0, 0, 0, 0.3) 0 2px 4px;
      --lane-yellow: rgba(242, 228, 157, 0.06); --lane-blue: rgba(94, 167, 216, 0.08); --lane-green: rgba(206, 231, 170, 0.06);
      --t-gray: #3f4245;
      --t-coral: rgba(229, 130, 131, 0.26); --t-yellow: rgba(242, 228, 157, 0.2); --t-green: rgba(206, 231, 170, 0.2); --t-blue: #27405a;
      --f-gray: rgba(255, 255, 255, 0.86);
      --f-coral: var(--f-gray); --f-yellow: var(--f-gray); --f-green: var(--f-gray); --f-blue: var(--f-gray);
      --d-gray: #8f8f8f;
      --d-coral: #e58283; --d-yellow: #f2e49d; --d-green: #cee7aa; --d-blue: #5ea7d8;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(35, 131, 226, 0.28); }
  [hidden] { display: none !important; }
  button { cursor: pointer; background: none; border: 0; padding: 0; font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid rgba(35, 131, 226, 0.6); outline-offset: 1px; border-radius: 4px; }
  .i { width: 14px; height: 14px; flex: none; }

  /* Error notice: hidden unless the data can't load, a save fails, or the script fails */
  .toast { position: fixed; right: 16px; bottom: 16px; z-index: 60; display: flex; align-items: center; gap: 8px; max-width: calc(100vw - 32px); padding: 8px 12px; border-radius: 6px; background: var(--pop); box-shadow: var(--pop-shadow); color: #d44c47; font-size: 14px; }
  .toast.calm { color: var(--muted); }
  .toast button { height: 26px; padding: 0 8px; border-radius: 4px; color: var(--text); }
  .toast button:hover { background: var(--hover); }

  /* Short Notion-style banner; the icon overlaps its bottom edge by half */
  .banner { position: relative; height: clamp(150px, 16vw, 220px); overflow: hidden; background: var(--banner); }
  .banner img { position: absolute; inset: 0; display: block; width: 92%; max-width: 1320px; height: 100%; margin-inline: auto; object-fit: cover; object-position: center 52%; }
  .banner ~ .page .page-icon { position: relative; z-index: 1; margin-top: -52px; }

  .page { max-width: 1400px; margin: 0 auto; padding: 0 72px 120px; }
  .page-icon { display: block; width: 104px; height: 104px; margin: 44px 0 0 -4px; font-size: 88px; line-height: 104px; user-select: none; }
  .title { margin: 18px 0 10px; font-size: 40px; font-weight: 700; line-height: 1.2; }
  /* What to say in Chat: one line under the title */
  .say { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 0 0 22px; color: var(--muted); font-size: 14px; }
  .say b { height: 24px; padding: 0 8px; border-radius: 4px; background: var(--hover); color: var(--text); font-weight: 500; line-height: 24px; white-space: nowrap; }

  /* Views, like a Notion database's tabs */
  .views { display: flex; align-items: center; gap: 2px; margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .tab { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; color: var(--muted); font-size: 14px; white-space: nowrap; }
  .tab:hover { background: var(--hover); }
  .tab[aria-selected="true"] { background: var(--hover); color: var(--text); font-weight: 500; }

  /* An idea opens from the right, over half the screen, with its plan */
  .side {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 40;
    display: flex;
    flex-direction: column;
    width: clamp(360px, 50vw, 640px);
    max-width: 100vw;
    background: var(--bg);
    box-shadow: var(--pop-shadow);
    transform: translateX(100%);
    visibility: hidden;
    transition: transform 0.28s cubic-bezier(0.2, 0, 0, 1), visibility 0s linear 0.28s;
  }
  .side.open { transform: none; visibility: visible; transition: transform 0.28s cubic-bezier(0.2, 0, 0, 1), visibility 0s; }
  .side-bar { display: flex; flex: none; align-items: center; justify-content: space-between; height: 44px; padding: 0 10px; }
  .icon-btn { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 4px; color: var(--faint); }
  .icon-btn:hover { background: var(--hover); color: var(--muted); }
  .icon-btn .i { width: 16px; height: 16px; }
  .side-body { flex: 1; overflow-y: auto; padding: 16px 48px 60px; }
  .side-icon { margin-bottom: 8px; font-size: 44px; line-height: 1.1; }
  .side-title { margin: 0 0 14px; font-size: 26px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
  .prop { display: flex; align-items: center; min-height: 32px; font-size: 14px; }
  .prop-name { flex: none; width: 110px; color: var(--muted); }
  .divider { margin: 14px 0 8px; border: 0; border-top: 1px solid var(--line); }
  .blk { margin: 18px 0 6px; font-size: 16px; font-weight: 600; }
  .side-plan { margin: 0; font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
  .side-plan.none { color: var(--faint); }

  /* Board: one tinted column per status, each with a status pill on top */
  .board { display: grid; grid-template-columns: repeat(3, minmax(0, 360px)); gap: 12px; align-items: start; }
  .lane { min-width: 0; padding: 6px 6px 8px; border-radius: 8px; background: var(--lane); }
  .lane.yellow { --lane: var(--lane-yellow); }
  .lane.blue { --lane: var(--lane-blue); }
  .lane.green { --lane: var(--lane-green); }
  .lane-head { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 4px; }
  .count { color: var(--faint); font-size: 13px; }
  .cards { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .empty { margin: 6px 6px 4px; color: var(--faint); font-size: 13px; }
  .more { height: 28px; margin-top: 6px; padding: 0 8px; border-radius: 4px; color: var(--muted); font-size: 13px; }
  .more:hover { background: var(--hover); }

  .card { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 9px 10px 10px; border-radius: 6px; background: var(--card); box-shadow: var(--card-shadow); }
  .card-head { display: flex; align-items: flex-start; gap: 7px; }
  .card-icon { flex: none; width: 18px; font-size: 14px; line-height: 20px; text-align: center; }
  .card-title { flex: 1; min-width: 0; margin: 0; font-size: 14px; font-weight: 500; line-height: 20px; overflow-wrap: anywhere; }
  button.card { width: 100%; text-align: left; }
  button.card:hover { background: color-mix(in srgb, var(--card), var(--text) 3%); }
  button.card[aria-expanded="true"] { box-shadow: 0 0 0 1.5px var(--d-yellow), var(--card-shadow); }
  a.card-title { text-decoration: none; }
  a.card-title:hover { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
  .when { color: var(--muted); font-size: 12px; }
  /* One click marks a draft posted; clicking again takes it back */
  .check { display: grid; place-items: center; flex: none; width: 16px; height: 16px; margin: 2px 1px 0; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-strong); color: transparent; }
  .check:hover { box-shadow: inset 0 0 0 1.5px var(--d-green); color: var(--d-green); }
  .check.on { background: var(--d-green); box-shadow: none; color: #fff; }
  .check .i { width: 10px; height: 10px; }

  .tag { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; height: 20px; padding: 0 6px; border-radius: 3px; background: var(--tb); color: var(--tf); font-size: 12px; line-height: 20px; white-space: nowrap; }
  .tag > span { overflow: hidden; text-overflow: ellipsis; }
  .tag.status { padding: 0 8px 0 7px; border-radius: 10px; font-size: 13px; }
  .tag.status::before { content: ""; width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--td); }
  .k-gray { --tb: var(--t-gray); --tf: var(--f-gray); --td: var(--d-gray); }
  .k-yellow { --tb: var(--t-yellow); --tf: var(--f-yellow); --td: var(--d-yellow); }
  .k-green { --tb: var(--t-green); --tf: var(--f-green); --td: var(--d-green); }
  .k-blue { --tb: var(--t-blue); --tf: var(--f-blue); --td: var(--d-blue); }

  /* All posts: a plain database table */
  .tbl-scroll { overflow-x: auto; }
  table.db { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 14px; }
  .db th { height: 34px; padding: 0 8px; border-bottom: 1px solid var(--line); color: var(--muted); font-weight: 400; text-align: left; white-space: nowrap; }
  .db td { height: 38px; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .db td.name { font-weight: 500; }
  .db td.name a { text-decoration: none; }
  .db td.name a:hover { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
  .db td.date { color: var(--muted); white-space: nowrap; }
  .db .tag.status { font-size: 12px; }

  /* Confirm dialog: StashBase blocks the browser's own confirm(), so it's built into the page */
  .modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: rgba(15, 15, 15, 0.4); }
  .modal-card { width: min(420px, 100%); padding: 20px 20px 16px; border-radius: 10px; background: var(--pop); box-shadow: var(--pop-shadow); }
  .modal-card h3 { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
  .modal-body { color: var(--muted); font-size: 14px; }
  .modal-body p { margin: 0 0 8px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .ghost-btn { height: 28px; padding: 0 12px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line-strong); font-size: 14px; }
  .ghost-btn:hover { background: var(--hover); }
  .danger-btn { height: 28px; padding: 0 12px; border-radius: 6px; background: var(--d-coral); color: #fff; font-size: 14px; font-weight: 600; }
  .danger-btn:hover { filter: brightness(0.94); }

  @media (max-width: 1040px) {
    .page { padding: 0 40px 96px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .side, .side.open { transition: none; }
  }
  @media (max-width: 760px) {
    .board { grid-template-columns: minmax(0, 1fr); }
    .side { width: 100vw; }
    .side-body { padding: 16px 22px 60px; }
  }
  @media (max-width: 640px) {
    .page { padding: 0 18px 80px; }
    .title { font-size: 32px; }
    .banner { height: clamp(96px, 24vw, 120px); }
    .banner ~ .page .page-icon { width: 80px; height: 80px; margin-top: -40px; font-size: 68px; line-height: 80px; }
  }
</style>
</head>
<body>
  <div class="toast" id="toast" hidden>
    <span id="toast-text" role="status" aria-live="polite"></span>
    <button type="button" id="retry" hidden>Retry</button>
    <button type="button" id="toast-close" aria-label="Close" title="Close">×</button>
  </div>

  <section class="banner" aria-label="Illustration of a desk with a laptop showing a post, a phone, a lightbulb, and a calendar">
    <img src="./assets/banner.png" width="2172" height="724" alt="" fetchpriority="high" decoding="async">
  </section>

  <main class="page">
    <div class="page-icon" role="img" aria-label="Notepad">🗒️</div>
    <h1 class="title">LinkedIn Ghostwriter</h1>
    <p class="say" id="start"></p>

    <div class="views" role="tablist" aria-label="Views">
      <button type="button" role="tab" class="tab" data-view="board"><span data-icon="board"></span>Pipeline</button>
      <button type="button" role="tab" class="tab" data-view="table"><span data-icon="table"></span>All posts</button>
    </div>

    <div class="board" id="board">
      <section class="lane yellow" aria-label="Ideas">
        <div class="lane-head"><span class="tag status k-yellow">Ideas</span><span class="count" id="n-ideas"></span></div>
        <div id="ideas"></div>
      </section>
      <section class="lane blue" aria-label="Drafts">
        <div class="lane-head"><span class="tag status k-blue">Drafts</span><span class="count" id="n-drafts"></span></div>
        <div id="drafts"></div>
      </section>
      <section class="lane green" aria-label="Posted">
        <div class="lane-head"><span class="tag status k-green">Posted</span><span class="count" id="n-posted"></span></div>
        <div id="posted"></div>
      </section>
    </div>
    <div id="table" hidden></div>
  </main>

  <aside class="side" id="side" aria-label="Idea" inert>
    <div class="side-bar">
      <button type="button" class="icon-btn" data-close-side aria-label="Close" title="Close"><span data-icon="close"></span></button>
      <button type="button" class="icon-btn" data-drop-open aria-label="Drop this idea" title="Drop this idea"><span data-icon="trash"></span></button>
    </div>
    <div class="side-body" id="side-body"></div>
  </aside>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title"></h3>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" data-modal="cancel">Cancel</button>
        <button type="button" class="danger-btn" data-modal="ok">OK</button>
      </div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // The dashboard is a list of what's next: ideas waiting to be written, drafts waiting to go out, and what's posted.
  // It all comes from one data file. Each post is its own file in posts/, and its title links there:
  // StashBase opens a relative link in a new tab. The page can mark a draft posted and drop an idea; the Agent does the rest.
  const DATA_PATH = "./assets/posts.json";
  const POSTS_DIR = "posts/";
  const POSTED_SHOWN = 6;
  const PATHS = {
    close: '<path d="M3.5 3.5 8 8l-4.5 4.5M8.5 3.5 13 8l-4.5 4.5"/>',
    trash: '<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/>',
    check: '<path d="m3 8.5 3.2 3L13 4.5"/>',
    board: '<rect x="2" y="3" width="3.4" height="10" rx="1"/><rect x="6.3" y="3" width="3.4" height="7" rx="1"/><rect x="10.6" y="3" width="3.4" height="8.5" rx="1"/>',
    table: '<rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 6.5h12M2 9.8h12M6.5 6.5V13"/>',
  };
  const icon = (name, width = 1.6) => `<svg class="i" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[name]}</svg>`;

  const $ = (selector) => document.querySelector(selector);
  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const isObj = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
  const arr = (value) => (Array.isArray(value) ? value : []);
  const str = (value) => (typeof value === "string" ? value : "");
  const isDate = (s) => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);

  // Dates are local calendar days, never times, written out the way Notion does: November 4, 2026.
  const parse = (s) => {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  };
  const longDate = (s) => parse(s).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
  // Newest first; anything without a date goes last.
  const newestFirst = (key) => (a, b) => (b[key] || "").localeCompare(a[key] || "");
  // A post's date is the day it was written, from the start of its file name, so it's always right
  // and nothing else has to keep it. Posts go newest first by that name.
  const fileDate = (p) => (isDate(p.file.slice(0, 10)) ? p.file.slice(0, 10) : "");
  const byFile = (a, b) => b.file.localeCompare(a.file);

  // Each idea and post keeps `at`, its place in the file, so the page changes exactly that entry.
  function normalize(raw) {
    const src = isObj(raw) ? raw : {};
    return {
      example: src.example === true,
      ideas: arr(src.ideas).map((i, at) => (isObj(i) ? {
        at,
        date: isDate(i.date) ? i.date : "",
        idea: str(i.idea).trim(),
        plan: str(i.plan).trim(),
      } : null)).filter((i) => i && i.idea).sort(newestFirst("date")),
      posts: arr(src.posts).map((p, at) => (isObj(p) ? {
        at,
        title: str(p.title).trim(),
        file: str(p.file).trim(),
        posted: p.posted === true || isDate(p.posted),
      } : null)).filter((p) => p && p.title),
    };
  }

  const api = window.stashbase?.data;
  let raw = {};
  let data = normalize(raw);
  let canSave = false;
  let saveError = "";
  let saving = false;
  let revision = 0;
  let savedRevision = 0;
  let saveTimer = 0;
  let queue = Promise.resolve();
  let toastKind = "";
  let view = "board";
  let allPosted = false;
  let openAt = null; // the idea open on the right, by its place in the file

  /* ---------- Saving: each change goes to the shared draft at once, and to the file after a short pause ---------- */

  const snapshot = () => JSON.parse(JSON.stringify(raw));

  function enqueue(operation) {
    const task = queue.then(operation);
    queue = task.catch(() => {});
    return task;
  }

  function commit() {
    revision += 1;
    data = normalize(raw);
    if (canSave) {
      const snap = snapshot();
      enqueue(() => api.update(snap)).catch((error) => {
        saveError = `Couldn't save: ${error?.message || error}`;
        renderSaveState();
      });
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 800);
    }
    renderSaveState();
    render();
  }

  async function save() {
    clearTimeout(saveTimer);
    if (!canSave || saving || savedRevision === revision) return;
    const rev = revision;
    const snap = snapshot();
    saving = true;
    try {
      await enqueue(async () => {
        await api.update(snap);
        await api.save();
      });
      savedRevision = rev;
      saveError = "";
    } catch (error) {
      saveError = `Couldn't save: ${error?.message || error}`;
    } finally {
      saving = false;
      if (!saveError && savedRevision !== revision) saveTimer = setTimeout(save, 800);
      renderSaveState();
    }
  }

  // Saving is quiet: the notice shows only when something is wrong, or once in a plain browser, where nothing saves.
  function renderSaveState() {
    if (canSave && saveError) notify(`${saveError}. Your changes are still on the page.`, "save");
    else if (toastKind === "save") hideToast();
    else if (!canSave && revision === 1) notify("Preview mode · changes won't be saved", "preview");
  }

  /* ---------- Views ---------- */

  function renderSay() {
    // "Set me up" only while the template's example is still here.
    const steps = [data.example && "Set me up.", "I have an idea: …", "Write about …"].filter(Boolean);
    $("#start").innerHTML = `<span aria-hidden="true">💬</span><span>Say in Chat</span>${steps.map((say) => `<b>“${esc(say)}”</b>`).join("")}`;
  }

  const postLink = (p, cls) => (p.file
    ? `<a class="${cls}" href="${POSTS_DIR}${encodeURIComponent(p.file)}">${esc(p.title)}</a>`
    : `<span class="${cls}">${esc(p.title)}</span>`);
  const statusTag = (p) => (p.posted ? '<span class="tag status k-green">Posted</span>' : '<span class="tag status k-blue">Draft</span>');

  // An idea shows just its line on the board; click it to see the plan on the right.
  function ideaCard(i) {
    return `<button type="button" class="card" data-idea="${i.at}" aria-expanded="${openAt === i.at}">
      <span class="card-head"><span class="card-icon" aria-hidden="true">💡</span><span class="card-title">${esc(i.idea)}</span></span>
    </button>`;
  }

  function renderSide() {
    const i = data.ideas.find((x) => x.at === openAt);
    if (!i) return closeSide();
    $("#side-body").innerHTML = `
      <div class="side-icon" aria-hidden="true">💡</div>
      <h2 class="side-title">${esc(i.idea)}</h2>
      ${i.date ? `<div class="prop"><span class="prop-name">Added</span><span>${esc(longDate(i.date))}</span></div>` : ""}
      <hr class="divider">
      <h3 class="blk">Plan</h3>
      ${i.plan ? `<p class="side-plan">${esc(i.plan)}</p>` : '<p class="side-plan none">No plan yet.</p>'}`;
  }

  function postCard(p) {
    const on = !!p.posted;
    const label = on ? "Mark as not posted" : "Mark as posted";
    return `<div class="card">
      <div class="card-head">
        <button type="button" class="check${on ? " on" : ""}" data-check="${p.at}" aria-pressed="${on}" aria-label="${label}" title="${label}">${icon("check", 2)}</button>
        ${postLink(p, "card-title")}
      </div>
      ${fileDate(p) ? `<span class="when">${esc(longDate(fileDate(p)))}</span>` : ""}
    </div>`;
  }

  function lane(id, items, card, empty, more = "") {
    $(`#${id}`).innerHTML = items.length ? `<div class="cards">${items.map(card).join("")}</div>${more}` : `<p class="empty">${empty}</p>`;
  }

  function renderBoard() {
    const drafts = data.posts.filter((p) => !p.posted).sort(byFile);
    const posted = data.posts.filter((p) => p.posted).sort(byFile);
    const shown = allPosted ? posted : posted.slice(0, POSTED_SHOWN);
    const more = posted.length > POSTED_SHOWN
      ? `<button type="button" class="more" data-more>${allPosted ? "Show fewer" : `Show all ${posted.length}`}</button>`
      : "";
    $("#n-ideas").textContent = data.ideas.length || "";
    $("#n-drafts").textContent = drafts.length || "";
    $("#n-posted").textContent = posted.length || "";
    lane("ideas", data.ideas, ideaCard, "No ideas yet. Say “I have an idea: …” in Chat.");
    lane("drafts", drafts, postCard, "Nothing waiting. Say “Write about …” with one of your ideas.");
    lane("posted", shown, postCard, "Nothing posted yet.", more);
  }

  // Every post in one table, drafts first, then newest out first.
  function renderTable() {
    const rows = [...data.posts].sort((a, b) => (a.posted - b.posted) || byFile(a, b));
    $("#table").innerHTML = rows.length ? `<div class="tbl-scroll"><table class="db">
      <thead><tr><th>Post</th><th>Status</th><th>Written</th></tr></thead>
      <tbody>${rows.map((p) => `<tr>
        <td class="name">${postLink(p, "")}</td>
        <td>${statusTag(p)}</td>
        <td class="date">${fileDate(p) ? esc(longDate(fileDate(p))) : ""}</td>
      </tr>`).join("")}</tbody>
    </table></div>` : '<p class="empty">No posts yet.</p>';
  }

  function render() {
    renderSay();
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === view)));
    $("#board").hidden = view !== "board";
    $("#table").hidden = view !== "table";
    renderBoard();
    renderTable();
    if (openAt !== null) renderSide();
  }

  /* ---------- Changes from the page ---------- */

  function togglePosted(at) {
    const p = arr(raw.posts)[at];
    if (!isObj(p)) return;
    p.posted = !(p.posted === true || isDate(p.posted));
    commit();
  }

  async function dropIdea(at) {
    const i = arr(raw.ideas)[at];
    if (!isObj(i)) return;
    const ok = await ask("Drop this idea?", `<p>“${esc(str(i.idea))}” will be gone from your ideas.</p>`, "Drop");
    if (!ok || arr(raw.ideas)[at] !== i) return;
    raw.ideas.splice(at, 1);
    closeSide();
    commit();
  }

  /* ---------- Confirm dialog ---------- */

  const modalEl = $("#modal");
  let modalResolve = null;
  function ask(title, bodyHtml, okLabel = "OK") {
    $("#modal-title").textContent = title;
    $("#modal-body").innerHTML = bodyHtml;
    const ok = modalEl.querySelector('[data-modal="ok"]');
    ok.textContent = okLabel;
    modalEl.hidden = false;
    ok.focus();
    return new Promise((resolve) => { modalResolve = resolve; });
  }
  function closeModal(result) {
    if (!modalResolve) return;
    modalEl.hidden = true;
    const resolve = modalResolve;
    modalResolve = null;
    resolve(result);
  }
  modalEl.addEventListener("click", (event) => {
    const button = event.target.closest("[data-modal]");
    if (button) closeModal(button.dataset.modal === "ok");
    else if (event.target === modalEl) closeModal(false);
  });
  const sideEl = $("#side");
  function openSide(at) {
    openAt = at;
    renderSide();
    renderBoard();
    $("#side-body").scrollTop = 0;
    sideEl.classList.add("open");
    sideEl.removeAttribute("inert");
    sideEl.querySelector("[data-close-side]").focus({ preventScroll: true });
  }
  function closeSide() {
    if (openAt === null && !sideEl.classList.contains("open")) return;
    openAt = null;
    sideEl.classList.remove("open");
    sideEl.setAttribute("inert", "");
    renderBoard();
  }
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape") return;
    if (!modalEl.hidden) closeModal(false);
    else closeSide();
  });
  // A click anywhere else closes the panel; clicking another idea switches to it.
  document.addEventListener("pointerdown", (event) => {
    if (openAt !== null && !sideEl.contains(event.target) && !event.target.closest("[data-idea], .modal, .toast")) closeSide();
  });

  document.addEventListener("click", (event) => {
    const t = event.target;
    const check = t.closest("[data-check]");
    if (check) return togglePosted(Number(check.dataset.check));
    const idea = t.closest("[data-idea]");
    if (idea) return openSide(Number(idea.dataset.idea));
    if (t.closest("[data-close-side]")) return closeSide();
    if (t.closest("[data-drop-open]")) return dropIdea(openAt);
    const tab = t.closest("[data-view]");
    if (tab) {
      view = tab.dataset.view;
      return render();
    }
    if (t.closest("[data-more]")) {
      allPosted = !allPosted;
      renderBoard();
    }
  });

  /* ---------- Start ---------- */

  // There's no console in StashBase, so problems show at the bottom right, ready to pass on.
  function notify(message, kind) {
    toastKind = kind;
    $("#toast-text").textContent = message;
    $("#toast").classList.toggle("calm", kind === "preview");
    $("#retry").hidden = kind !== "save";
    $("#toast").hidden = false;
  }
  function hideToast() {
    toastKind = "";
    $("#toast").hidden = true;
  }
  const showProblem = (message) => notify(message, "error");
  const lineOf = (stack) => /:(\d+):\d+\)?\s*$/m.exec(String(stack || "").split("\n")[1] || "")?.[1];
  addEventListener("error", (event) => {
    if (/ResizeObserver loop/i.test(event.message || "")) return;
    const line = event.lineno || lineOf(event.error?.stack);
    showProblem(`Page error: ${event.message || "unknown error"}${line ? ` (line ${line})` : ""}`);
  });
  addEventListener("unhandledrejection", (event) => {
    const reason = event.reason;
    const line = lineOf(reason?.stack);
    showProblem(`Page error: ${reason?.message || reason}${line ? ` (line ${line})` : ""}`);
  });
  $("#toast-close").addEventListener("click", hideToast);
  $("#retry").addEventListener("click", () => {
    saveError = "";
    hideToast();
    save();
  });
  addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") save();
  });
  addEventListener("beforeunload", (event) => {
    if (canSave && (saving || savedRevision !== revision)) {
      event.preventDefault();
      event.returnValue = "";
    }
  });

  async function start() {
    document.querySelectorAll("[data-icon]").forEach((n) => n.insertAdjacentHTML("afterbegin", icon(n.dataset.icon, 1.4)));
    try {
      if (api && typeof api.load === "function") {
        raw = await api.load(DATA_PATH);
        canSave = typeof api.update === "function" && typeof api.save === "function";
      } else {
        try {
          const response = await fetch(DATA_PATH);
          if (response.ok) raw = await response.json();
        } catch {
          // Opened straight from disk in a browser, the page can't read its data, so it shows empty.
        }
      }
    } catch (error) {
      showProblem(`Couldn't load the dashboard: ${error?.message || error}`);
    }
    raw = isObj(raw) ? raw : {};
    data = normalize(raw);
    render();
  }

  start();
})();
</script>
</body>
</html>
